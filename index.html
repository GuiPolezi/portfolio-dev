<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>PortFolio - DEV</title>
</head>

<body>
  <div style="height: 100vh; position: relative;" class="flex flex-col justify-center w-full px-5">
    <h1 id="dev">
      <span>D.</span>
      <span id="dev-mid">esign & Development</span>
      <span id="dev-ev">ev</span>
    </h1>

    <h2 id="myName">Guilherme Polezi Machado</h2>
    <div id="root" class="h-140 p-20">
    </div>
    <div class="navbar flex justify-between p-4 items-start">
      <div class="theme-changer flex gap-3">
        <label class="flex items-center gap-1 cursor-pointer">
          <input type="checkbox"
            class="w-3 h-3 text-black border-black-500 rounded cursor-pointer" />
          <span class="text-base text-black">Dark</span>
        </label>
        <label class="flex items-center gap-1 cursor-pointer">
          <input type="checkbox"
            class="w-3 h-3 text-black border-black-500 rounded cursor-pointer" />
          <span class="text-base text-black">Light</span>
        </label>
      </div>
      <div class="menu-btn">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="40" height="40" fill="#000000"
          style="opacity:1;">
          <path
            d="M8 6a2 2 0 1 1-4 0a2 2 0 0 1 4 0m0 6a2 2 0 1 1-4 0a2 2 0 0 1 4 0m-2 8a2 2 0 1 0 0-4a2 2 0 0 0 0 4m8-14a2 2 0 1 1-4 0a2 2 0 0 1 4 0m-2 8a2 2 0 1 0 0-4a2 2 0 0 0 0 4m2 4a2 2 0 1 1-4 0a2 2 0 0 1 4 0m4-10a2 2 0 1 0 0-4a2 2 0 0 0 0 4m2 4a2 2 0 1 1-4 0a2 2 0 0 1 4 0m-2 8a2 2 0 1 0 0-4a2 2 0 0 0 0 4" />
        </svg>
      </div>
      <p style="font-size: 10px; width: max-content; color: gray;">© Desenvolvido por Gui Polezi</p>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>
  <script type="module" src="/src/main.jsx"></script>
  <script>
    // 1. Selecionando os elementos
    const container = document.getElementById("dev");
    const midText = document.getElementById("dev-mid");
    const alphaletter = document.getElementById("dev-ev");

    // O container precisa de cursor pointer/default e não quebrar linha
    gsap.set(container, {
      cursor: "default",
      display: "inline-flex",
      alignItems: "baseline",
      width: "max-content"
    });

    // 2. Setup inicial dos textos
    gsap.set(midText, {
      width: 0,
      opacity: 0,
      overflow: "hidden",
      display: "inline-block",
      whiteSpace: "nowrap",
    });

    gsap.set(alphaletter, {
      overflow: "hidden",
      display: "inline-block",
      whiteSpace: "nowrap",
    });

    // 3. Criando a Timeline Pausada (O SEGREDO DA ROBUSTEZ)
    // Criamos a animação uma única vez e guardamos na variável 'tl'
    const tl = gsap.timeline({ paused: true });

    // Adicionamos o que acontece na Timeline:
    // Passo 1: Esconder o "ev"
    tl.to(alphaletter, {
      width: 0,
      opacity: 0,
      duration: 0.3,
      ease: "power2.inOut"
    }, 0); // O "0" no final significa que começa no instante zero da timeline

    // Passo 2: Mostrar o "esign & Development"
    tl.to(midText, {
      width: "auto",
      opacity: 1,
      duration: 0.5,
      ease: "power3.out"
    }, 0); // O "0" faz ele animar AO MESMO TEMPO que o "ev" some

    // 4. Event Listeners Simplificados
    // Agora só controlamos o "fita cassete" da animação
    container.addEventListener("mouseenter", () => {
      tl.play(); // Toca para frente
    });

    container.addEventListener("mouseleave", () => {
      tl.reverse(); // Toca de ré (o GSAP inverte toda a lógica e tempos perfeitamente)
    });
  </script>
</body>

</html>
