<!doctype html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>PortFolio - DEV</title>
</head>

<body>
  <div style="height: 100vh; position: relative;" class="flex flex-col justify-center w-full px-5">
    <h1 id="dev">
      <span>D.</span>
      <span id="dev-mid">esign & Development</span>
      <span id="dev-ev">ev</span>
    </h1>

    <h2 id="myName">Guilherme Polezi Machado</h2>
    <div id="root" class="h-140 p-20">
    </div>
    <div class="navbar flex justify-between p-4 items-start">
      <div class="theme-changer flex gap-3">
        <label class="flex items-center gap-1 cursor-pointer">
          <input type="radio" name="theme-selection" value="dark" class="accent-black" />
          <span class="text-base text-black dark:text-white">Dark</span>
        </label>
        <label class="flex items-center gap-1 cursor-pointer">
          <input type="radio" name="theme-selection" value="light" class="accent-black" />
          <span class="text-base text-black dark:text-white">Light</span>
        </label>
      </div>
      <div class="menu-wrapper">
        <div class="menu-btn text-black dark:text-white cursor-pointer w-max transition-transform active:scale-95">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="40" height="40" fill="currentColor">
            <circle cx="6" cy="6" r="2" />
            <circle cx="12" cy="6" r="2" />
            <circle cx="18" cy="6" r="2" />

            <circle cx="6" cy="12" r="2" />
            <circle id="middle-dot" cx="12" cy="12" r="2" />
            <circle cx="18" cy="12" r="2" />

            <circle cx="6" cy="18" r="2" />
            <circle cx="12" cy="18" r="2" />
            <circle cx="18" cy="18" r="2" />
          </svg>
        </div>
        <div class="dropdown bg-blue-500" id="dropdown">
          <div class="dropdown-item">
            <a href="/">Home</a>
          </div>
          <div class="dropdown-item">
            <p>Info</p>
          </div>
          <div class="dropdown-item">
            <p>Projects</p>
          </div>
          <div class="dropdown-item">
            <p>Lab</p>
          </div>
          <div class="dropdown-item">
            <p>Stacks</p>
          </div>
          <div class="dropdown-item">
            <p>Contact</p>
          </div>
        </div>
      </div>

      <p style="font-size: 10px; width: max-content; color: gray;">© Developed By <a
          href="https://github.com/GuiPolezi/" target="_blank">Gui Polezi</a></p>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>
  <script type="module" src="/src/main.jsx"></script>
  <script>
    // 1. Selecionando os elementos
    const container = document.getElementById("dev");
    const midText = document.getElementById("dev-mid");
    const alphaletter = document.getElementById("dev-ev");

    // O container precisa de cursor pointer/default e não quebrar linha
    gsap.set(container, {
      cursor: "default",
      display: "inline-flex",
      alignItems: "baseline",
      width: "max-content"
    });

    // 2. Setup inicial dos textos
    gsap.set(midText, {
      width: 0,
      opacity: 0,
      overflow: "hidden",
      display: "inline-block",
      whiteSpace: "nowrap",
    });

    gsap.set(alphaletter, {
      overflow: "hidden",
      display: "inline-block",
      whiteSpace: "nowrap",
    });

    // 3. Criando a Timeline Pausada (O SEGREDO DA ROBUSTEZ)
    // Criamos a animação uma única vez e guardamos na variável 'tl'
    const tl = gsap.timeline({ paused: true });

    // Adicionamos o que acontece na Timeline:
    // Passo 1: Esconder o "ev"
    tl.to(alphaletter, {
      width: 0,
      opacity: 0,
      duration: 0.3,
      ease: "power2.inOut"
    }, 0); // O "0" no final significa que começa no instante zero da timeline

    // Passo 2: Mostrar o "esign & Development"
    tl.to(midText, {
      width: "auto",
      opacity: 1,
      duration: 0.5,
      ease: "power3.out"
    }, 0); // O "0" faz ele animar AO MESMO TEMPO que o "ev" some

    // 4. Event Listeners Simplificados
    // Agora só controlamos o "fita cassete" da animação
    container.addEventListener("mouseenter", () => {
      tl.play(); // Toca para frente
    });

    container.addEventListener("mouseleave", () => {
      tl.reverse(); // Toca de ré (o GSAP inverte toda a lógica e tempos perfeitamente)
    });
  </script>
  <script>
    // Envolvemos tudo para garantir que o HTML já foi carregado
    document.addEventListener('DOMContentLoaded', () => {

      const root = document.documentElement; // A tag <html>
      const radios = document.querySelectorAll('input[name="theme-selection"]');

      // 1. O equivalente ao seu useState (pega do storage ou padrão 'light')
      const initialTheme = localStorage.getItem('theme') || 'light';

      // 2. A função que faz a mágica (equivalente ao seu useEffect)
      function applyTheme(theme, animate = true) {
        // Salva a escolha do usuário
        localStorage.setItem('theme', theme);

        // Adiciona/Remove a classe do Tailwind
        if (theme === 'dark') {
          root.classList.add('dark');
        } else {
          root.classList.remove('dark');
        }

        // Deixa a bolinha certa marcada no HTML
        const activeRadio = document.querySelector(`input[name="theme-selection"][value="${theme}"]`);
        if (activeRadio) activeRadio.checked = true;

        // Configuração de cores baseada no tema escolhido
        const cores = {
          backgroundColor: theme === 'dark' ? '#0f172a' : '#ffffff',
          color: theme === 'dark' ? '#f8fafc' : '#0f172a',
        };

        // Se for clique do usuário, faz a animação suave. 
        // Se for apenas o recarregamento da página, aplica direto.
        if (animate) {
          gsap.to('body', {
            ...cores,
            duration: 0.5,
            ease: 'power2.out',
          });
        } else {
          gsap.set('body', cores);
        }
      }

      // 3. Ao abrir a página, aplica o tema salvo instantaneamente (sem animação)
      applyTheme(initialTheme, false);

      // 4. Adiciona o ouvinte de cliques nos inputs (equivalente ao seu onChange)
      radios.forEach(radio => {
        radio.addEventListener('change', (e) => {
          applyTheme(e.target.value, true); // Aplica com animação
        });
      });

    });
  </script>
  
  <script>
    
    // Registre o plugin primeiro (necessário se usar módulos ou builds)
    // gsap.registerPlugin(DrawSVGPlugin);
    const menuBtn = document.querySelector('.menu-btn');
    const middleDot = document.querySelector('#middle-dot');

    // Variável para rastrear o estado
    let isMenuOpen = false;

    // Criamos a animação (agora ela não precisa ser uma timeline pausada se for apenas um estado)
    const animateMiddleDot = (shouldHide) => {
      gsap.to(middleDot, {
        scale: shouldHide ? 0 : 1,
        opacity: shouldHide ? 0 : 1,
        transformOrigin: "center center",
        duration: 0.4,
        ease: "back.out(2)" // "back.out" fica mais natural para "aparecer/sumir"
      });
    };



    const dropdown = document.querySelector('#dropdown');
    const items = document.querySelectorAll('.dropdown-item');

    // Estado inicial já escondido via GSAP (em vez de CSS opacity: 0 manual)
    gsap.set(items, { opacity: 0, y: -8 });
    gsap.set(dropdown, { display: "none", opacity: 0, scale: 0.95, transformOrigin: "top center",  });

    const openMenu = () => {
      dropdown.classList.add('open');

      gsap.to(dropdown, {display: "block", opacity: 1, scale: 1, duration: 0.25, ease: "power2.out" });

      gsap.to(items, {
        opacity: 1,
        y: 0,
        duration: 0.3,
        stagger: 0.06,      // cada item abre 60ms depois do anterior
        ease: "power2.out"
      });

      // Seu código existente do ponto do meio
      gsap.to(middleDot, { scale: 0, opacity: 0, transformOrigin: "center center", duration: 0.4, ease: "back.out(2)" });
    };

    const closeMenu = () => {
      gsap.to(dropdown, {
        display: "none",
        opacity: 0,
        scale: 0.95,
        duration: 0.2,
        ease: "power2.in",
        onComplete: () => dropdown.classList.remove('open') // remove pointer-events só no fim
      });
      gsap.to(items, { opacity: 0, y: -8, duration: 0.15, ease: "power2.in" });
      gsap.to(middleDot, { scale: 1, opacity: 1, transformOrigin: "center center", duration: 0.4, ease: "back.out(2)" });
    };

    menuBtn.addEventListener('click', (e) => {
      e.stopPropagation(); // evita fechar imediatamente pelo listener do document
      isMenuOpen = !isMenuOpen;
      isMenuOpen ? openMenu() : closeMenu();
    });

    // Fecha ao clicar fora
    document.addEventListener('click', () => {
      if (isMenuOpen) { isMenuOpen = false; closeMenu(); }
    });
    
  </script>
</body>

</html>
